# Spike B — forged module round-trip (PROMPT §6/§7 feasibility).
#
# Dependency: rhai — the §7 L2 candidate itself, so the spike must use the real
# thing. Pure Rust, sandboxed by construction (no ambient fs/net/env/process),
# builtin operation/depth limits. Version "1" = latest 1.x; the API surface used
# (Engine, AST, call_fn, register_fn) has been stable across 1.x.
# Features: default-features off, then only "std" (required for HashMap host
# side; rhai itself still exposes NO std-io to scripts), "no_float" + "only_i64"
# to shrink the type universe and the wasm binary. Removal cost: swap the
# interpreter behind Host::register (QuickJS/Lua per ADR-003) — Module/Manifest/
# ForgeError are rhai-free.
[package]
name = "forge-spike"
version = "0.1.0"
edition = "2021"

[lib]
# cdylib so `cargo build --target wasm32-unknown-unknown` emits a measurable
# .wasm (feeds ADR-003); rlib for native tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
rhai = { version = "1", default-features = false, features = ["std", "no_float", "only_i64"] }
