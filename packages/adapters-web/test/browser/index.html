<!doctype html>
<meta charset="utf-8">
<title>adapters-web — browser checks</title>
<script type="importmap">
{
  "imports": {
    "@harness/kernel": "/packages/kernel/src/index.js",
    "@harness/context": "/packages/context/src/index.js",
    "@harness/agent": "/packages/agent/src/index.js",
    "@harness/core": "/packages/core/src/index.js",
    "@harness/adapters-web": "/packages/adapters-web/src/index.js"
  }
}
</script>
<style>
  body { font: 15px/1.5 ui-monospace, monospace; margin: 2rem; }
  li { margin-bottom: .5rem; }
  .ok::before { content: "PASS "; color: #197a2c; }
  .no::before { content: "FAIL "; color: #b3261e; }
  .detail { opacity: .7; }
</style>
<h1>adapters-web — what bun test cannot reach</h1>
<ul id="results"><li>running…</li></ul>
<script type="module">
  import { runSuite } from '/packages/adapters-web/test/browser/suite.js'
  const list = document.getElementById('results')
  const results = await runSuite().catch((err) => [{ name: 'the suite itself', ok: false, detail: String(err) }])
  list.innerHTML = ''
  for (const result of results) {
    const li = document.createElement('li')
    li.className = result.ok ? 'ok' : 'no'
    li.append(result.name)
    const detail = document.createElement('div')
    detail.className = 'detail'
    detail.textContent = result.detail
    li.append(detail)
    list.append(li)
  }
  window.__harnessChecks = results
  document.title = results.every((r) => r.ok) ? 'ALL PASS' : 'FAILED'
</script>
