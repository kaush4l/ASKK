[workspace]
resolver = "2"
members = ["crates/core", "crates/inference", "crates/runtime", "crates/web"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
askk-core = { path = "crates/core" }
askk-inference = { path = "crates/inference" }
askk-runtime = { path = "crates/runtime" }

[profile.release]
opt-level = "z"
lto = true
strip = true
