[package]
name = "askk"
version = "0.1.0"
authors = ["kaush <kaushal.beyblader@gmail.com>"]
edition = "2024"
rust-version = "1.96"

[dependencies]
dioxus = { version = "0.7.9", features = [] }
async-trait = "0.1"
postcard = { version = "1", features = ["use-std"] }
futures-channel = "0.3"
futures-util = "0.3"
gloo-net = "0.7"
indexed_db_futures = { version = "0.6.4", features = ["serde"] }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde", "js"] }
wasm-bindgen = "0.2.123"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    # Document/DOM, workers, streams, storage (pre-existing surface).
    "Blob", "BlobPropertyBag", "Document", "Element", "ErrorEvent", "File",
    "FileSystemDirectoryHandle", "FileSystemFileHandle", "FileSystemGetDirectoryOptions",
    "FileSystemGetFileOptions", "FileSystemHandle", "FileSystemHandleKind",
    "FileSystemRemoveOptions", "FileSystemWritableFileStream", "MessageEvent", "Navigator",
    "NodeList", "ReadableStream", "ReadableStreamDefaultReader", "StorageManager",
    "TextDecoder", "Url", "Window", "WritableStream", "Worker", "WorkerGlobalScope",
    "WorkerNavigator", "WorkerOptions", "WorkerType", "console", "Crypto", "CryptoKey",
    "History", "Notification", "NotificationOptions", "NotificationPermission", "Storage",
    "SubtleCrypto",
    # Browser-capability surface: camera/mic capture, screen share, geolocation,
    # permissions introspection, speech synthesis, clipboard (capability tools + probe panel).
    "MediaDevices", "MediaStream", "MediaStreamConstraints", "MediaStreamTrack",
    "MediaTrackConstraints", "DisplayMediaStreamConstraints", "HtmlVideoElement",
    "HtmlCanvasElement", "CanvasRenderingContext2d", "MediaRecorder", "MediaRecorderOptions",
    "BlobEvent", "Geolocation", "Position", "Coordinates",
    "PositionOptions", "PositionError", "Permissions", "PermissionStatus", "PermissionState",
    "SpeechSynthesis", "SpeechSynthesisUtterance", "Clipboard", "Screen",
] }
regex = "1.12.3"
# Content-addressing for the workspace filesystem (src/storage/workspace_fs.rs):
# the SHA-256 that backs compare-and-swap writes and FileMeta hints. Pure Rust,
# so the hash is identical on the host (cargo test) and in wasm — the CAS logic
# stays host-testable instead of needing the browser's async SubtleCrypto.
sha2 = "0.10"

# Browser-only: hard timeouts for in-browser code execution (src/browser_exec.rs).
[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", features = ["futures"] }

# Browser-only: headless integration test for the in-browser MCP worker round-trip
# (src/mcp/worker_transport.rs `browser_tests`). Run with a webdriver, e.g.
# `wasm-pack test --headless --safari`. Kept off the host build so `cargo test` is
# unaffected.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[dev-dependencies]
pollster = "0.4"

# Strip debug-info from the release artifact: wasm-opt (binaryen) aborts with a
# DWARF "UNREACHABLE" SIGABRT when the release wasm carries debug sections, which
# left the gh-pages bundle un-optimized. Stripping clears the DWARF so wasm-opt runs.
[profile.release]
strip = true
