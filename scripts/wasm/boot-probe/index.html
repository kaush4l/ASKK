<!doctype html>
<meta charset="utf-8">
<title>c2w boot probe</title>
<h1>container2wasm boot probe</h1>
<p>No COOP/COEP. No SharedArrayBuffer. No xterm-pty. The guest is given a
command as argv and its stdout is captured; nothing here can block on stdin.</p>
<pre id="out">starting…</pre>
<script>
const out = document.getElementById("out");
const lines = [];
const t0 = performance.now();
function log(s) { lines.push(s); out.textContent = lines.join("\n"); }

log("crossOriginIsolated = " + self.crossOriginIsolated);
log("SharedArrayBuffer   = " + (typeof SharedArrayBuffer !== "undefined"));

const params = new URLSearchParams(location.search);
const wasmUrl = params.get("wasm") || "./guest.wasm";
// `argv` splits on comma so one element can contain spaces (a shell -c string);
// `cmd` is the convenient space-split form.
const argv = params.has("argv")
  ? params.get("argv").split(",")
  : (params.get("cmd") || "uname -a").split(" ");

const w = new Worker("./probe-worker.js");
w.onmessage = (e) => {
  const d = e.data;
  if (d.type === "log") log(d.text);
  else if (d.type === "stdout") log("GUEST STDOUT: " + JSON.stringify(d.text));
  else if (d.type === "done") {
    log("EXIT " + d.code + " at " + Math.round(performance.now() - t0) + " ms");
    log("PROBE-COMPLETE");
  } else if (d.type === "error") { log("PROBE-ERROR " + d.text); }
};
w.postMessage({ wasmUrl: new URL(wasmUrl, location.href).href, argv });
</script>
