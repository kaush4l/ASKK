<!doctype html><html lang="en"><meta charset="utf-8"><title>Browser Linux verification</title><pre id="status">Preparing browser Linux…</pre><script type="module">
import { BrowserLinuxExecution } from '/source-browser-linux.js'
const params = new URL(location.href).searchParams
const checks = []
const log = []
const started = performance.now()
const metadata = { startedAt: new Date().toISOString(), userAgent: navigator.userAgent, crossOriginIsolated, network: 'browser-fetch-cors', companionAuthorization: false }
const stages = []
window.__browserLinuxProbe = { state: 'running', checks, log, metadata, stages }
const runtime = new BrowserLinuxExecution({ projectId: params.get('project') || 'runtime-proof', assetsURL: '/browser-linux/', onEvent(event) {
  if (event.type === 'runtime.console') { log.push(String(event.data)); if (log.length > 1000) log.shift() }
  if (event.type === 'job.output') { log.push(`[${event.jobId}/${event.stream}] ${event.data}`); if (log.length > 1000) log.shift() }
  if (event.type === 'runtime.progress') { window.__browserLinuxProbe.phase = event.phase; if (stages.at(-1)?.phase !== event.phase || event.phase === 'Checking tools') stages.push({ phase: event.phase, message: event.message, atMilliseconds: performance.now() - started }) }
  document.getElementById('status').textContent = `${event.type}${event.phase ? `: ${event.phase}` : ''}${event.message ? ` — ${event.message}` : ''}\n${JSON.stringify(checks)}\n${log.join('').slice(-4000)}`
} })
const assert = (condition, name, evidence) => { checks.push({ name, passed: Boolean(condition), evidence, atMilliseconds: performance.now() - started }); if (!condition) throw new Error(name) }
const job = async (id, program, args) => { const began = performance.now(); const result = await runtime.startJob({ id, program, args, signal: AbortSignal.timeout(id === 'read-shared-file' ? 600000 : 900000) }); assert(result.code === 0, id, { ...result, milliseconds: performance.now() - began }); return result }
try {
  await runtime.prepare()
  checks.push({ name: 'ready', evidence: runtime.describeCapabilities(), atMilliseconds: performance.now() - started })
  if (params.get('profile') === '1') {
    for (const [label, flags] of [['default', []], ['jitless', ['--jitless']], ['no-snapshot', ['--no-node-snapshot']], ['jitless-no-snapshot', ['--jitless', '--no-node-snapshot']]]) {
      const began = performance.now()
      const result = await runtime.startJob({ id: `profile-${label}`, program: 'node', args: [...flags, '-e', 'console.log(JSON.stringify({node:process.versions.node,cpu:process.cpuUsage(),uptime:process.uptime()}))'], signal: AbortSignal.timeout(180000) })
      checks.push({ name: `profile-${label}`, evidence: result, milliseconds: performance.now() - began, atMilliseconds: performance.now() - started })
    }
  }
  if (params.get('phase') === 'reload') {
    assert((await runtime.read('persisted.txt')).content === 'durable browser guest 🦊', 'durable reload')
  } else {
    assert(await runtime.read('missing.txt') === null, 'Linux missing-file errno')
    await runtime.write({ path: 'persisted.txt', content: 'durable browser guest 🦊', expectedRevision: null })
    const beforeJavaScript = await runtime.request('runtime.metrics')
    await job('read-shared-file', 'node', ['-e', 'const s=require("node:fs").readFileSync("persisted.txt","utf8");if(s!=="durable browser guest 🦊")process.exit(2);console.log(s);console.log(JSON.stringify({cpu:process.cpuUsage(),uptime:process.uptime()}))'])
    checks.push({ name: 'JavaScript supervisor CPU comparison', evidence: { before: beforeJavaScript, after: await runtime.request('runtime.metrics') }, atMilliseconds: performance.now() - started })
    const binary = btoa(String.fromCharCode(0, 255, 128, 17, 0))
    await runtime.write({ path: 'assets/proof.bin', base64: binary })
    assert((await runtime.snapshot('')).files.find((file) => file.path === 'assets/proof.bin')?.base64 === binary, 'binary workspace round trip')
    assert((await runtime.write({ path: 'persisted.txt', content: 'lost update', expectedRevision: 'stale' })).conflict, 'stale editor write rejected')
    const terminal = await runtime.openTerminal({ cols: 91, rows: 31 })
    let terminalOutput = ''
    const unsubscribe = runtime.subscribeTerminal(terminal.id, (event) => { if (event.type === 'output') terminalOutput += event.data })
    await runtime.resizeTerminal(terminal.id, 103, 37)
    await runtime.terminalInput(terminal.id, 'stty size\n')
    const terminalDeadline = Date.now() + 30000
    while (!/37\s+103/.test(terminalOutput) && Date.now() < terminalDeadline) await new Promise((resolve) => setTimeout(resolve, 50))
    assert(/37\s+103/.test(terminalOutput), 'interactive PTY resize', terminalOutput)
    unsubscribe(); await runtime.closeTerminal(terminal.id)
    const controller = new AbortController()
    const running = runtime.startJob({ id: 'cancel-proof', program: 'node', args: ['-e', 'setInterval(()=>{},1000)'], signal: controller.signal })
    setTimeout(() => controller.abort(), 1500)
    assert((await running).cancelled, 'live process cancellation')
  }
  if (params.get('build') === '1') {
      await runtime.write({ path: 'package.json', content: JSON.stringify({ private: true, scripts: { build: 'next build --webpack' }, dependencies: { next: '16.3.6', react: '19.3.0', 'react-dom': '19.3.0' } }) })
      await runtime.write({ path: 'next.config.mjs', content: 'export default {output:"export",images:{unoptimized:true},experimental:{cpus:1}}' })
      await runtime.write({ path: 'pages/index.js', content: 'import React from "react";export default function Page(){return React.createElement("main",null,"Browser Linux build proof")}' })
      await job('pinned-template-lock', 'cp', ['/opt/harness/template/package-lock.json', 'package-lock.json'])
      await job('npm-ci', 'npm', ['ci', '--offline', '--no-audit', '--no-fund'])
      await job('next-build', 'env', ['NODE_ENV=production', 'NEXT_TELEMETRY_DISABLED=1', 'npm', 'run', 'build'])
      const artifact = await runtime.snapshot('out')
      const index = artifact.files.find((file) => file.path === 'index.html')
      assert(index && atob(index.base64).includes('Browser Linux build proof'), 'actual Next static export', { revision: artifact.revision, files: artifact.files.length })
  }
  if (params.get('network') === '1') {
    const cache = await job('npm-cache-check', 'npm', ['cache', 'ls', 'left-pad'])
    assert(!cache.stdout.trim(), 'network package absent from the baked npm cache')
    await job('npm-network-install', 'npm', ['install', '--no-save', '--ignore-scripts', '--package-lock=false', '--no-audit', '--no-fund', '--fetch-retries=0', '--fetch-timeout=30000', 'left-pad@1.3.0'])
    await job('network-package-execution', 'node', ['-e', 'const pad=require("left-pad");if(pad("7",3,"0")!=="007")process.exit(2);console.log("uncached registry package executed")'])
  }
  await runtime.dispose()
  window.__browserLinuxProbe = { state: 'passed', checks, log, metadata, stages, milliseconds: performance.now() - started }
} catch (error) {
  window.__browserLinuxProbe = { state: 'failed', error: error.stack || String(error), checks, log, metadata, stages, milliseconds: performance.now() - started }
  await runtime.dispose().catch(() => {})
}
const outcome = window.__browserLinuxProbe
document.getElementById('status').textContent = JSON.stringify({ state: outcome.state, error: outcome.error, metadata: outcome.metadata, stages: outcome.stages, checks: outcome.checks, milliseconds: outcome.milliseconds, consoleTail: outcome.log.join('').slice(-2000) }, null, 2)
</script></html>
