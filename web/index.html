<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ASKK</title>
  <base data-trunk-public-url>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#1b1024">
  <!-- The site lives under a repo subpath (kaush4l.github.io/ASKK/), so every
       reference here is relative; an origin-absolute path white-pages in
       production and publish.sh gates on it. -->
  <link data-trunk rel="rust" href="../crates/ui/Cargo.toml" data-bin="ui" data-wasm-opt="z">
  <link data-trunk rel="css" href="theme.css">
  <link data-trunk rel="copy-file" href="sw.js">
  <link data-trunk rel="copy-file" href="coi-sw.js">
  <link data-trunk rel="copy-file" href="manifest.webmanifest">
  <link data-trunk rel="copy-file" href="icon.svg">
</head>
<body>
  <div id="main"></div>
  <noscript>
    <!-- The app is Rust compiled to WebAssembly and mounted by JavaScript;
         with scripting off there is nothing to show but the truth. -->
    <h1>ASKK</h1>
    <p>This page is a WebAssembly application: it needs JavaScript enabled to
      load, and browser storage to keep your conversation on this device. No
      server holds your data.</p>
  </noscript>
  <script>
    // Cross-origin isolation comes from the service worker (GitHub Pages
    // cannot set headers), so the FIRST load is uncontrolled and therefore
    // not isolated: reload once, through the worker. The double-load is the
    // known price, guarded by a one-per-tab flag so a worker that fails to
    // isolate cannot spin the page.
    function reloadForIsolation() {
      if (window.crossOriginIsolated) { sessionStorage.removeItem("coi-reload"); return; }
      if (sessionStorage.getItem("coi-reload")) return;
      sessionStorage.setItem("coi-reload", "1");
      location.reload();
    }
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.addEventListener("controllerchange", reloadForIsolation);
      navigator.serviceWorker.register("sw.js").then(function () {
        if (navigator.serviceWorker.controller) reloadForIsolation();
      }).catch(function (e) {
        // Non-fatal: the app still runs, just without isolation (I15).
        console.warn("sw register failed:", e);
      });
    }
  </script>
</body>
</html>
