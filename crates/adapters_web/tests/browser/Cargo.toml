# THE BROWSER SUITE — the fifth gate command (I17), and the reason it is a
# PACKAGE rather than three files in `crates/adapters_web/tests/`.
#
# `#[wasm_bindgen_test]` expands to ABSOLUTE `::core::option::Option` and
# `::core::concat!` paths (wasm-bindgen-test-macro-0.3.71/src/lib.rs:89-139).
# This workspace ships a crate literally named `core`, which owns `::core` in
# the extern prelude of anything that depends on it — and an integration test
# under `adapters_web` inherits that dependency, so every `#[wasm_bindgen_test]`
# there fails to compile with "cannot find `option` in `core`". A crate-root
# `mod core` does not shadow a `::`-rooted path; Cargo refuses to take the same
# path dependency twice under two names. A package that names the workspace core
# `harness` and never claims `::core` is the one arrangement that compiles.
#
# `[workspace]` below makes this its own workspace root: the repo's `crates/*`
# member glob does not reach a third level, so without it Cargo would refuse to
# build a package that sits inside a workspace and is not a member of it.
[workspace]

[package]
name = "browser_suite"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# Nothing imports this; a package needs a target and the tests below are it.
path = "src/lib.rs"

[dependencies]
# The crate under test. Everything else here exists to reach into it.
adapters_web = { path = "../.." }
# The port traits the store is exercised THROUGH — `KvStore`/`BlobStore` are
# what a caller holds, and testing `IdbStore`'s inherent methods instead would
# be testing something the core never calls.
kernel = { path = "../../../kernel" }
# The workspace core, renamed: `boot`/`Ports`/`Writership` are needed to put TWO
# real apps over one IndexedDB, and the name `core` is spoken for (see above).
harness = { package = "core", path = "../../../core" }
# The in-memory ports, so the two apps differ from production in exactly one
# axis — the store is real. Removal cost: a second copy of a crate that exists.
adapters_test = { path = "../../../adapters_test" }

[dev-dependencies]
# The browser harness itself: `#[wasm_bindgen_test]` + the runner protocol.
# Removal cost: `adapters_web` goes back to being `cargo check`ed only, and
# every claim in it about IndexedDB, Web Locks and two contexts over one store
# becomes unexecutable again — which is the defect this package exists to fix.
wasm-bindgen-test = "0.3"
# Held to the workspace's exact pin: the runner and the codegen agree on a
# schema hash, and a drift here is a "schema mismatch" at run time, not compile.
wasm-bindgen = "=0.2.121"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# `Worker`, because `AgentWorkers::listen_to` takes the typed one the crate
# under test installs its handlers on. Same version the crate itself resolves
# (one lock, one copy), or the two `Worker` types would not be the same type.
web-sys = { version = "0.3", features = ["Worker", "MessageEvent"] }
