[package]
name = "adapters_web"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "wasm-bindgen port impls + the Wasm composition root (the only browser-aware crate)"

[lib]
# cdylib for the wasm-bindgen build; rlib so `cargo check --workspace` links.
crate-type = ["cdylib", "rlib"]

[dependencies]
kernel = { path = "../kernel" }
core = { path = "../core" }
# The transport wire format (Request/Response JSON) — see WebApp::handle_request.
serde_json = { workspace = true }
# The one JS/Wasm FFI layer; pinned exact per G0 coordination. The layering
# check asserts it appears in THIS crate's closure only (I3, mechanically).
wasm-bindgen = { workspace = true }
# Required by #[wasm_bindgen] async methods (Promise <-> Future bridge).
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }

[dependencies.web-sys]
workspace = true
# Only the IndexedDB surface + fetch + crypto — the ports we actually adapt.
features = [
  "Window",
  "IdbFactory",
  "IdbOpenDbRequest",
  "IdbRequest",
  "IdbDatabase",
  "IdbObjectStore",
  "IdbTransaction",
  "IdbTransactionMode",
  "IdbKeyRange",
  "Crypto",
  "DomException",
  # One Worker per agent (increment 06) and the DOM read that finds this
  # build's fingerprinted bundle to hand them.
  "Worker",
  "WorkerOptions",
  "WorkerType",
  "MessageEvent",
  "Document",
  "Element",
  "NodeList",
  "AbortSignal",
  "Request",
  "RequestInit",
  "RequestCache",
  "Response",
  "Headers",
  "console",
]

# rhai → ahash → getrandom needs the JS backend on wasm32; the matching
# `--cfg getrandom_backend="wasm_js"` rustflag lives in /.cargo/config.toml.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[lints]
workspace = true
