[package]
name = "ui"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "L3 Dioxus app: the shell, rendering through core::handle (I4)"

[[bin]]
name = "ui"
path = "src/main.rs"

[dependencies]
kernel = { path = "../kernel" }
# The composition root that owns boot and the browser ports; the UI never
# builds a port itself.
adapters_web = { path = "../adapters_web" }
# dioxus: the UI runtime that replaces htmx. Event handlers call the seam
# directly, so no application logic survives in JS (I5). Removal cost: back to
# a hand-written JS transport, which is exactly what this deletes.
dioxus = { version = "0.7", features = ["web"] }
# web-sys: `window()`, to tell a page apart from an agent's Worker (which
# imports this same bundle for its exported AgentWorker, increment 06), and the
# one `focus()` the ARIA tabs pattern's roving tabindex requires (increment 08),
# and localStorage for the one bit that remembers the plain skin (increment 12).
#   …and `Location` + `EventTarget` for the one binding that makes each view a
#   URL: read the hash at boot, write it on a change, follow `hashchange` (F13).
#   …and the speech APIs of increment 19, all of them used only in
#   `src/composer/voice.rs` and each one a line:
#   `SpeechRecognition` is the dictation object (and its own feature test);
#   `SpeechRecognitionEvent` carries the transcript; `SpeechRecognitionResultList`,
#   `SpeechRecognitionResult` and `SpeechRecognitionAlternative` are what you walk
#   to reach the words; `SpeechSynthesis` is the reader and `SpeechSynthesisUtterance`
#   the thing it reads; `NodeList` and `Node` are `querySelectorAll` and the
#   `textContent` of the reply being read. Features, not dependencies: web-sys is
#   already here and none of these adds a crate.
web-sys = { workspace = true, features = ["Window", "Document", "Element", "HtmlElement", "Storage", "Location", "EventTarget", "Node", "NodeList", "SpeechRecognition", "SpeechRecognitionEvent", "SpeechRecognitionResult", "SpeechRecognitionResultList", "SpeechRecognitionAlternative", "SpeechSynthesis", "SpeechSynthesisUtterance"] }
# wasm-bindgen: the cast behind that one `focus()` call and nothing else.
wasm-bindgen = { workspace = true }

[lints]
workspace = true
