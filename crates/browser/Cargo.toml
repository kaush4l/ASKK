[package]
name = "askk-browser"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
askk-core.workspace = true
askk-inference.workspace = true
askk-engine.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
dioxus = { version = "0.7", features = ["web"] }

[build-dependencies]
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "Location",
    "Navigator",
    "StorageManager",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemGetFileOptions",
    "FileSystemGetDirectoryOptions",
    "FileSystemWritableFileStream",
    "File",
    "Blob",
    "Headers",
    "Request",
    "RequestInit",
    "Response",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "AbortController",
    "AbortSignal",
    "Worker",
    "WorkerOptions",
    "WorkerType",
    "BroadcastChannel",
    "MessageEvent",
    "ErrorEvent",
    # Features lab: browser-capability surface (camera/mic/screen, geolocation,
    # clipboard, notifications, speech synthesis). See src/capabilities/.
    "MediaDevices",
    "MediaStream",
    "MediaStreamConstraints",
    "MediaStreamTrack",
    "MediaRecorder",
    "BlobEvent",
    "HtmlVideoElement",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "Geolocation",
    "Position",
    "Coordinates",
    "PositionError",
    "PositionOptions",
    "Clipboard",
    "Notification",
    "NotificationOptions",
    "NotificationPermission",
    "SpeechSynthesis",
    "SpeechSynthesisUtterance",
] }
