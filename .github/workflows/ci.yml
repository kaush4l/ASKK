# Every push: the rules, the tests and the landmark, then the one source built for every
# machine GitHub offers. What each build is: docs/maintenance.md ("Builds"). What the
# landmark proves: docs/decisions.md (section 4).
name: ci

on:
  push:
    branches: [main, rust]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The same command a person runs before keeping a change (scripts/check.sh): the tests and
  # the walls in src/structure.rs, a compile of each build, the full app built and started,
  # and the landmark: the engine loop as a terminal process, as a hosted service, and in a
  # browser tab. On the two platforms 0.1 promises.
  check:
    name: check and landmark (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, name: "Mac, M-series", target: aarch64-apple-darwin }
          - { os: ubuntu-latest, name: "Linux", target: x86_64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          # dx strips the finished program with the toolchain's own tool, which needs these.
          components: llvm-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: check
      # The landmark runs an engine's program in node, and drives the browser with it.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # dx puts the full app together; wasm-bindgen prepares the tab. The second must be the
      # version the program was built against (named in Cargo.lock).
      - name: which wasm-bindgen
        id: bindgen
        shell: bash
        run: echo "version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/[^0-9.]/, ""); print; exit }' Cargo.lock)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@0.7.10,wasm-bindgen-cli@${{ steps.bindgen.outputs.version }}
      # A run's log needs a login to read; its summary does not. When the check fails, the end
      # of what it said and the disk's room go there.
      - name: check
        shell: bash
        run: |
          # GitHub's bash stops at the first failure (-e); the end must still be written down.
          set +e -o pipefail
          ./scripts/check.sh 2>&1 | tee check.log
          status=$?
          if [ "$status" != 0 ]; then
            { echo "### check.sh ended with $status"; echo '```'; tail -80 check.log; echo; df -h . /tmp; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - uses: actions/upload-artifact@v7
        with:
          name: askk-app-${{ matrix.target }}
          path: target/dx/askk/release/web
          if-no-files-found: error

  # The host alone (the server that runs the engines), as released, for each machine:
  # beyond what 0.1 promises, so that the one source is known to still build everywhere.
  host:
    name: host ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-26-intel, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: build the host
        run: cargo build --release --features "server terminals sandbox" --target ${{ matrix.target }}
      - name: test on this machine
        # The tests start real programs (`sh`, `cp`); Windows has none of them yet.
        if: runner.os != 'Windows'
        shell: bash
        run: cargo test --features "server terminals sandbox" --target ${{ matrix.target }} 2>&1 | tee test.log
      # A run's log needs a login to read; its summary does not. Say there what failed.
      - name: say which test failed
        if: failure()
        shell: bash
        run: |
          [ -f test.log ] || exit 0
          said=$(grep -E 'panicked at|^test .* FAILED|^error|^failures:' -A5 test.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=tests on ${{ matrix.target }}::$said"
          node --version || true
      - uses: actions/upload-artifact@v7
        with:
          name: askk-host-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/askk
            target/${{ matrix.target }}/release/askk.exe
          if-no-files-found: error

  # The two builds that run in a browser: a window on a host (`web`), and the whole app
  # inside the tab (`local`, the one GitHub Pages serves; see pages.yml).
  browser:
    name: browser ${{ matrix.build }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { build: web, flags: "--features web" }
          - { build: local, flags: "--no-default-features --features local" }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.build }}
      - run: cargo build --release --target wasm32-unknown-unknown ${{ matrix.flags }}
