[workspace]
resolver = "2"
members = [
    "crates/shared",
    "crates/web",
    "crates/server",
    "crates/terminal",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

# One workspace, four crates, one shared core.
# shared   = pure, std-only (+ serde for the API types), no UI / no I/O.
# web      = Dioxus 0.7.10 shell: web + router + Tailwind, fullstack.
# server   = Axum server via Dioxus fullstack (`dioxus::server::router`).
#            Switched from Actix-web 4 on 2026-11-12: Dioxus `#[server]`
#            functions are Axum-only in 0.7, so Actix could not use
#            them — it needed hand-written API routes + manual SSR.
# terminal = Ratatui + Crossterm TUI shell over the same shared core.

[workspace.dependencies]
dioxus = { version = "=0.7.10", features = ["web", "router"] }
dioxus-ssr = "=0.7.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.6", features = ["fs"] }
ratatui = "0.29"
crossterm = "0.28"

[profile.release]
opt-level = "z"
